<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe vs CPU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">You are <span class="x-color">X</span> &mdash; CPU is <span class="o-color">O</span></p>

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">You (X)</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">CPU (O)</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Your turn!</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-restart" id="restart">New Game</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
